# GitHub Pages（Jekyll）配置。Pages 源为 main 分支 /docs。
#
# 加这个文件的原因：站点此前没有 sitemap.xml 也没有 robots.txt（两者都 404），
# 而 github.com 本身不提供 sitemap，爬虫发现新仓库只能靠外链。Pages 站是我们
# 唯一能自己挂 sitemap 的表面，也是唯一能在 Search Console / Bing 站长工具里
# 验证所有权的域名（github.com 不是我们的域名，验证不了）。

title: 国内 GEO 监测工具清单与免费档对比
description: >-
  逐家核对免费额度、覆盖引擎与采购风险。19 家厂商的逐字段披露率统计，
  9 个关键字段全行业 0/19 公开。覆盖 DeepSeek、豆包、文心一言、通义千问、腾讯元宝。
url: https://moreyiyi04-design.github.io
baseurl: /geo-monitor-audit
lang: zh-CN

theme: jekyll-theme-primer

# 各搜索引擎的所有权验证。jekyll-seo-tag 会据此在每页 <head> 渲染对应的 meta 标签。
# 用配置项而不是改模板，是因为 seo-tag 已随主题启用，改模板反而多一处需要跟着
# 主题升级维护的地方。
#
# github.com 不属于我们，无法验证；github.io 这个 Pages 站是唯一能提交 sitemap
# 和请求编入索引的表面。
#
# Bing 另有一条 XML 文件验证（docs/BingSiteAuth.xml），与这里的 meta 用同一个校验码，
# 两条都放着——哪条先被识别都行，Bing 的两种方式对子路径站点的支持情况不完全一致。
webmaster_verifications:
  google: EEzi7zp_D5ihJo_gkhxZTEdUTl9YF-FrS1AYukQTq2o
  bing: 5B46832C5F65E9A923C57F40338B30FA

# jekyll-sitemap 在 GitHub Pages 的插件白名单里，无需自建构建流程即可生成 sitemap.xml
plugins:
  - jekyll-sitemap

# 这些是仓库文档，不是站点页面；放进站点只会稀释主题相关性
exclude:
  - research
  - superpowers
  - DESIGN.md
  - METHODOLOGY.md
  - SEO_INDEXING.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
